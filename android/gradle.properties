org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental-compilation cache relativizes paths between the
# Gradle cache (pub-cache plugin sources) and the project directory. On
# Windows, when those live on different drive letters (e.g. plugin sources
# on C:, project on D:), File.relativeTo() throws "this and base files have
# different roots" and the build fails. Incremental compilation is a build
# speed optimization only — safe to disable.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
