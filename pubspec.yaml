name: fbr_taxvault
description: "EFS TaxVault — Scan Once. File Anytime."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Backend
  supabase_flutter: ^2.9.0

  # Modeling / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Secure session storage
  flutter_secure_storage: ^9.2.4

  # Formatting
  intl: ^0.20.2

  # Scanner: native document scanner (ML Kit on Android, VisionKit on iOS —
  # auto edge detection/capture/crop/multi-page come from the platform, not
  # hand-rolled Dart), gallery import, and pre-upload compression.
  doc_scan_flutter: ^2.0.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
