name: fbr_taxvault
description: "EFS TaxVault — Scan Once. File Anytime."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Backend
  supabase_flutter: ^2.9.0

  # Modeling / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Secure session storage
  flutter_secure_storage: ^9.2.4

  # Formatting
  intl: ^0.20.2

  # Scanner: native document scanner (ML Kit on Android, VisionKit on iOS —
  # auto edge detection/capture/crop/multi-page come from the platform, not
  # hand-rolled Dart), gallery import, and pre-upload compression.
  doc_scan_flutter: ^2.0.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  # On-device OCR. Extraction sends recognized text to Gemini instead of the
  # page image: ~10x fewer tokens and the fast text path instead of the slow
  # vision one. Runs locally with no network/quota cost.
  google_mlkit_text_recognition: ^0.17.1
  crypto: ^3.0.6
  excel: ^4.0.6
  share_plus: ^12.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1D5FE0"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
